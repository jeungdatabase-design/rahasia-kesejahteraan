<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rahasia Kesejahteraan — Akses Premium</title>
<style>html,body{margin:0;background:#0b1020;color:#fff;font-family:system-ui}#gate{min-height:100vh;display:grid;place-items:center}.box{max-width:420px;margin:20px;padding:30px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff0b;text-align:center}.spin{width:34px;height:34px;border:3px solid #ffffff22;border-top-color:#d8b56a;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 18px}@keyframes s{to{transform:rotate(360deg)}}.err{color:#ffb8b8;line-height:1.6}</style></head>
<body><div id="gate"><div class="box"><div class="spin"></div><h2 id="title">Memverifikasi akses premium…</h2><p id="msg">Mohon tunggu.</p></div></div>
<script>
(async()=>{
 const endpoint="https://qjnuswdosuujljwjvndy.supabase.co/functions/v1/ebook-premium-v2", token=new URLSearchParams(location.search).get("token");
 const title=document.getElementById("title"),msg=document.getElementById("msg");
 if(!token){title.textContent="Link akses tidak lengkap";msg.className="err";msg.textContent="Gunakan link premium yang dikirim setelah pembelian.";return}
 let device=localStorage.getItem("rk_premium_device"); if(!device){device="dev_"+crypto.randomUUID();localStorage.setItem("rk_premium_device",device)}
 try{
  const r=await fetch(endpoint+"?token="+encodeURIComponent(token),{cache:"no-store",headers:{"x-ebook-device":device}});
  const p=await r.json(); if(!r.ok||!p.ok) throw new Error(p.error||"Akses ditolak.");
  document.open();document.write(p.html);document.close();
 }catch(e){title.textContent="Akses tidak tersedia";msg.className="err";msg.textContent=e.message||"Terjadi kesalahan.";}
})();
</script></body></html>
